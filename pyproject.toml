[project]
name = "codegauge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.25.0",
    "pydantic>=2.7,<3",
    "jinja2>=3.1",
    "rich>=15.0",
]

[project.scripts]
codegauge = "codegauge.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegauge"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
